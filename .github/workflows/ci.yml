name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Node 24 (npm 11) alinhado com o lockfile gerado localmente; npm 10 (Node 20)
# rejeita as entradas inBundle de @emnapi/* das dependências opcionais.
# O workflow entra na chave de cache para não reaproveitar caches antigos de npm 10.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/workflows/ci.yml
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      # Valores fictícios apenas para gerar o Prisma Client e compilar a app em CI.
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      JWT_SECRET: "ci-only-jwt-secret-not-for-production"
      ENCRYPTION_KEY: "ci-only-encryption-key-not-for-production-32chars"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/workflows/ci.yml
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
